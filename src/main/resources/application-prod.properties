# Production profile - Railway

# App port
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Database - Railway MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
authorization.jwt.secret=${AUTHORIZATION_JWT_SECRET}
authorization.jwt.expiration.days=7

# Optional one-time administrator bootstrap.
iam.bootstrap.admin.username=${IAM_BOOTSTRAP_ADMIN_USERNAME:}
iam.bootstrap.admin.password=${IAM_BOOTSTRAP_ADMIN_PASSWORD:}
