# Production profile - Railway

# App port
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Actuator: expose health (for the keep-alive cron / UptimeRobot) and
# prometheus (for Grafana to scrape metrics), without leaking internal
# details, so both can be reached without authentication.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

# Database - Railway MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
authorization.jwt.secret=${AUTHORIZATION_JWT_SECRET}
authorization.jwt.expiration.days=7

# Optional one-time administrator bootstrap.
iam.bootstrap.admin.username=${IAM_BOOTSTRAP_ADMIN_USERNAME:}
iam.bootstrap.admin.password=${IAM_BOOTSTRAP_ADMIN_PASSWORD:}

# Public base URLs, used to build links sent in emails (e.g. email verification)
app.public-url=${APP_PUBLIC_URL:https://backend-nursepulse-qfct.onrender.com}
app.frontend-url=${APP_FRONTEND_URL:https://application-web-nurse-pulse.vercel.app}

# Notification Services (Brevo & Twilio)
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_FROM_NUMBER:}
