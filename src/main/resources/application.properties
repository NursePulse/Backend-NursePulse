# Spring Application Name
spring.application.name=NursePulse Platform

# Default Profile
spring.profiles.default=dev

# Railway / Local Port
server.port=${PORT:8080}

# Shared DataSource Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Naming Strategy
spring.jpa.hibernate.naming.physical-strategy=com.brainspark.nursepulse.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Documentation Information
documentation.application.description=NursePulse Platform Backend
documentation.application.version=@project.version@

# JWT Configuration
authorization.jwt.secret=${AUTHORIZATION_JWT_SECRET:9f4b6c2d8a1e7f3b5c9d0a2e6f8b1c4d7e9a3f5b8c2d6e1f0a9b7c3d5e8f1a2}
authorization.jwt.expiration.days=7

# Optional initial administrator. Leave blank unless bootstrapping a new environment.
iam.bootstrap.admin.username=${IAM_BOOTSTRAP_ADMIN_USERNAME:}
iam.bootstrap.admin.password=${IAM_BOOTSTRAP_ADMIN_PASSWORD:}

# Message Bundles
spring.messages.basename=messages
spring.messages.encoding=UTF-8
