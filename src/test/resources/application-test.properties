spring.datasource.url=jdbc:h2:mem:nursepulse;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

authorization.jwt.secret=nurse-pulse-test-secret-key-with-at-least-thirty-two-bytes
authorization.jwt.expiration.days=1
