name: Backend CI

on:
  push:
    branches: [main, deploy/render-docker]
  pull_request:
    branches: [main, deploy/render-docker]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B clean verify
